name: Train and Upload to Hugging Face

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          token = os.environ["HF_TOKEN"]
          
          # 🚨 已经修改为你的 ID
          repo_id = "somnus11/imdb-sentiment-nn"
          
          api = HfApi()
          print(f"正在准备仓库: {repo_id}")
          api.create_repo(repo_id=repo_id, token=token, exist_ok=True)

          # 上传整个 model 文件夹
          print("正在上传产物...")
          api.upload_folder(
              folder_path="model",
              repo_id=repo_id,
              token=token,
              path_in_repo="."
          )
          print(f"✅ 成功! 地址: https://huggingface.co/{repo_id}")
          EOF